<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>202439300207胡靖芬+特教图形语音配对闯关训练</title>
<style>
:root{--bg:#f4f2ec;--text:#4f5b59;--muted:#929b99;--green:#91aaa2;--dark:#718f86;--blue:#9fb7c5;--pink:#d5a8ae;--yellow:#d5c18d;--purple:#b6acc8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:radial-gradient(circle at 8% 12%,#dfe9e4,transparent 25%),radial-gradient(circle at 92% 15%,#eee1e2,transparent 25%),var(--bg)}
button,select{font:inherit}.app{width:min(1160px,calc(100% - 28px));margin:auto;padding:26px 0 16px}header{text-align:center}h1{margin:0;font-size:clamp(28px,4vw,46px);color:#536560}.sub{color:var(--muted);margin:8px 0 18px}.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.control{background:#ffffffc9;padding:10px 15px;border-radius:16px;box-shadow:0 5px 18px #50605b12;font-weight:700;display:flex;align-items:center;gap:8px}select{border:0;background:transparent;color:var(--text);font-weight:700}.switch{width:55px;height:30px;border:0;border-radius:30px;background:#d6dbd9;position:relative}.switch:after{content:"";position:absolute;width:24px;height:24px;left:3px;top:3px;border-radius:50%;background:white;transition:.25s}.switch.on{background:var(--green)}.switch.on:after{transform:translateX(25px)}
.game{background:#ffffffe8;border-radius:32px;padding:clamp(18px,3vw,30px);box-shadow:0 12px 30px #4856521a}.progress-row{max-width:850px;margin:auto;display:flex;gap:14px;align-items:center}.level{font-weight:800}.progress{height:14px;flex:1;background:#e9ece9;border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--green);transition:.4s;width:0}.instruction{text-align:center}.speaker{width:66px;height:66px;border-radius:50%;background:#dce8e3;margin:20px auto 8px;display:grid;place-items:center;font-size:31px}.hint{color:var(--muted);font-weight:700}.question{font-size:clamp(27px,3.5vw,40px);font-weight:800;margin:6px 0 12px}.replay,.restart{border:0;background:var(--green);color:white;border-radius:17px;padding:14px 23px;font-weight:800;font-size:18px;cursor:pointer}.feedback{height:38px;margin:12px 0 3px;font-size:21px;font-weight:800;opacity:0;transition:.2s;color:var(--dark)}.feedback.show{opacity:1}.feedback.bad{color:#9d7777}
.cards{max-width:940px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.cards.hard{grid-template-columns:repeat(3,1fr)}.card{min-height:185px;background:#fbfbf8;border:3px solid transparent;border-radius:27px;box-shadow:0 9px 22px #4d58551a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px)}.card.correct{border-color:var(--green);background:#eef5f1;animation:pop .55s}.card.wrong{border-color:#d1abab;background:#faf2f1;animation:shake .38s}.shape{width:108px;height:108px;display:grid;place-items:center}.name{font-size:21px;font-weight:800}.circle{width:100px;height:100px;border-radius:50%;background:var(--blue)}.square{width:96px;height:96px;border-radius:15px;background:var(--yellow)}.triangle{width:0;height:0;border-left:55px solid transparent;border-right:55px solid transparent;border-bottom:98px solid var(--green)}.star{width:108px;height:108px;background:var(--purple);clip-path:polygon(50% 2%,61% 35%,96% 35%,68% 56%,79% 91%,50% 70%,21% 91%,32% 56%,4% 35%,39% 35%)}.heart{width:108px;height:100px;background:var(--pink);clip-path:polygon(50% 92%,12% 55%,5% 39%,8% 22%,20% 10%,36% 8%,50% 21%,64% 8%,80% 10%,92% 22%,95% 39%,88% 55%)}.oval{width:108px;height:74px;border-radius:50%;background:#d6ae97}.rectangle{width:112px;height:72px;border-radius:13px;background:#a8b9a6}.diamond{width:78px;height:78px;border-radius:12px;background:#aaa9c2;transform:rotate(45deg)}
.report{display:none;text-align:center;max-width:780px;margin:25px auto}.report.show{display:block}.report h2{font-size:38px;margin:8px}.report-icon{font-size:60px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat{padding:20px 7px;border-radius:20px;background:#f6f7f4}.value{display:block;font-size:30px;font-weight:900;color:#6e8981}.label{color:var(--muted);font-weight:700}footer{text-align:center;color:#a2a8a6;font-size:13px;padding:18px 8px 0}
@keyframes pop{35%{transform:scale(1.08)}65%{transform:scale(.98)}}@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media(max-width:900px){.cards,.cards.hard{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.app{width:calc(100% - 16px);padding-top:16px}.game{padding:16px 10px}.cards{gap:10px}.card{min-height:150px}.shape{transform:scale(.8);margin:-7px}.name{font-size:18px}}
</style>
</head>
<body>
<main class="app">
<header><h1>特教图形语音配对闯关训练</h1><div class="sub">听一听 · 看一看 · 找到正确的图形</div></header>
<div class="toolbar">
<div class="control">闯关难度 <select id="difficulty"><option value="easy">简单 · 4 张卡片</option><option value="hard">困难 · 6 张卡片</option></select></div>
<div class="control">背景音乐 <button id="music" class="switch" aria-label="背景音乐开关"></button></div>
</div>
<section class="game">
<div id="game">
<div class="progress-row"><span id="level" class="level"></span><div class="progress"><div id="fill" class="fill"></div></div></div>
<div class="instruction"><div class="speaker">🔊</div><div class="hint">听语音，找到正确图形</div><div id="question" class="question"></div><button id="replay" class="replay">🔊 再听一次</button><div id="feedback" class="feedback"></div></div>
<div id="cards" class="cards"></div>
</div>
<div id="report" class="report"><div class="report-icon">⭐</div><h2>训练完成啦！</h2><p>今天的图形配对训练完成得很棒！</p><div class="stats"><div class="stat"><span id="total" class="value"></span><span class="label">总答题数</span></div><div class="stat"><span id="correct" class="value"></span><span class="label">答对数量</span></div><div class="stat"><span id="accuracy" class="value"></span><span class="label">正确率</span></div><div class="stat"><span id="time" class="value"></span><span class="label">训练总耗时</span></div></div><button id="restart" class="restart">再训练一次</button></div>
</section>
<footer>本页面可用于特教学校集体教学、区域活动、课间互动、班级日常管理，同样适用于 IEP 个别化教育个训。</footer>
</main>
<script>
const shapes=[["circle","圆形"],["square","正方形"],["triangle","三角形"],["star","五角星"],["heart","心形"],["oval","椭圆形"],["rectangle","长方形"],["diamond","菱形"]];
const levels=shapes.map(x=>x[0]);let current=0,attempts=0,correct=0,wrongThis=false,locked=false,start=Date.now(),musicOn=false,audioCtx=null,musicTimer=null;
const $=id=>document.getElementById(id),cards=$("cards"),feedback=$("feedback");
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shape(id){return shapes.find(x=>x[0]===id)}
function speak(){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance("请找出"+shape(levels[current])[1]);u.lang="zh-CN";u.rate=.82;u.pitch=1.05;speechSynthesis.speak(u)}
function render(){locked=false;wrongThis=false;feedback.className="feedback";feedback.textContent="";let target=shape(levels[current]),n=$("difficulty").value==="hard"?6:4;$("question").textContent="请找出"+target[1];$("level").textContent=`第 ${current+1} / ${levels.length} 关`;$("fill").style.width=`${current/levels.length*100}%`;cards.className=n===6?"cards hard":"cards";let opts=shuffle([target,...shuffle(shapes.filter(x=>x[0]!==target[0])).slice(0,n-1)]);cards.innerHTML="";opts.forEach(s=>{let b=document.createElement("button");b.className="card";b.innerHTML=`<div class="shape"><div class="${s[0]}"></div></div><div class="name">${s[1]}</div>`;b.onclick=()=>choose(b,s);cards.appendChild(b)});setTimeout(speak,450)}
function choose(b,s){if(locked)return;attempts++;if(s[0]===levels[current]){locked=true;if(!wrongThis)correct++;b.classList.add("correct");feedback.textContent="✓ 答对啦，真棒！";feedback.className="feedback show";tone(523);setTimeout(()=>tone(659),120);setTimeout(()=>{current++;current>=levels.length?finish():render()},1050)}else{wrongThis=true;b.classList.remove("wrong");void b.offsetWidth;b.classList.add("wrong");feedback.textContent="没关系，再找一找吧。";feedback.className="feedback show bad";setTimeout(()=>b.classList.remove("wrong"),650)}}
function finish(){speechSynthesis.cancel();$("game").style.display="none";$("report").classList.add("show");let sec=Math.max(1,Math.round((Date.now()-start)/1000));$("total").textContent=attempts;$("correct").textContent=`${correct} / ${levels.length}`;$("accuracy").textContent=Math.round(correct/levels.length*100)+"%";$("time").textContent=sec<60?sec+"秒":Math.floor(sec/60)+"分"+sec%60+"秒";let u=new SpeechSynthesisUtterance("训练完成啦，你做得很棒！");u.lang="zh-CN";speechSynthesis.speak(u)}
function reset(){current=attempts=correct=0;start=Date.now();$("report").classList.remove("show");$("game").style.display="block";render()}
function tone(f,v=.018){let AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!audioCtx)audioCtx=new AC();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.25);o.stop(audioCtx.currentTime+.27)}
function toggleMusic(){musicOn=!musicOn;$("music").classList.toggle("on",musicOn);if(musicOn){let ns=[262,330,392,330,294,349,440,349],i=0;musicTimer=setInterval(()=>tone(ns[i++%ns.length],.004),950)}else{clearInterval(musicTimer);musicTimer=null}}
$("replay").onclick=speak;$("restart").onclick=reset;$("difficulty").onchange=reset;$("music").onclick=toggleMusic;window.onload=render;
</script>
</body>
</html>
